name: check

# The same checks as `bun run check`, split into jobs that run side by side:
# the browser tests, most of the time, in four shards. A change to the design
# documents alone (docs/**/*.md, README, LICENSE) runs nothing; Markdown the
# checks read stays checked: kit/AGENTS.md and the skill (tests hold them
# alike, the help pages import the skill), and docs/mocks is linted. A newer
# push to the same pull request stops the run it replaces; every push to main
# runs to the end, as each one's result goes into the release records.
on:
  pull_request:
    paths-ignore:
      - "docs/**/*.md"
      - "README.md"
      - "LICENSE"
  push:
    branches: [main]
    paths-ignore:
      - "docs/**/*.md"
      - "README.md"
      - "LICENSE"

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  static:
    name: lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run build

  test:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: bun run test

  e2e:
    name: browser tests ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          browser: "true"
      - run: bunx playwright test --shard=${{ matrix.shard }}/4

  e2e-full-app:
    name: full-app browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          browser: "true"
      - run: bun run test:e2e:full-app
