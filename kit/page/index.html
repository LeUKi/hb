<!doctype html>
<!--
  附带网页模板：红包页旁边显示的网页，接好了红包站的 SDK。
  - 本地看效果：npm run page，浏览器打开它写的地址（模拟器：宽屏、手机、多人三种布局）；
    让 AI 看：npm run page -- --shot，截宽屏和手机三张图到 shots/，列出网页里的报错。
  - 能做的：读红包的公开信息和判定器的公开数据（view）、收新的动态、替看的人提交、读他自己的提交、
    给网页自己的后端拿身份令牌（hb.identity）。类型见 hb.d.ts，做法见 AGENTS.md 的“带网页的玩法”。
  - 照着做：输赢只由 judge.js 算，网页照着 view.data 画；提交时按钮写“判定中”；冷却倒数；没登录给登录按钮；
    单独打开时显示说明；先按手机设计（手机上网页在底部抽屉里）。
  - 改完放到静态托管上（比如 Cloudflare Workers、GitHub Pages），把地址写进 judge.js 的 meta.page。
-->
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>猜暗号</title>
    <script src="https://hb.lafi.sh/sdk/v1.js"></script>
    <style>
      body { margin: 0; padding: 24px 20px; font-family: system-ui, -apple-system, "PingFang SC", sans-serif; color: #2a1a1c; background: #fff; }
      main { max-width: 480px; margin: 0 auto; display: grid; gap: 16px; }
      h1 { margin: 0; font-size: 22px; }
      .muted { color: #9a8689; font-size: 13px; }
      .panel { background: #f7efef; border-radius: 12px; padding: 12px 14px; }
      form { display: flex; gap: 8px; }
      input { flex: 1; min-width: 0; font: inherit; padding: 10px 12px; border: 1px solid #e3d3d5; border-radius: 10px; }
      button { font: inherit; padding: 10px 16px; border: 0; border-radius: 10px; background: #d0213a; color: #fff; cursor: pointer; }
      button:disabled { opacity: 0.5; cursor: default; }
      ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; font-size: 14px; }
      #said { min-height: 1.5em; font-size: 15px; }
    </style>
  </head>
  <body>
    <main>
      <div>
        <h1 id="title">猜暗号</h1>
        <div class="muted" id="facts">正在接上红包页…</div>
      </div>
      <div class="panel" id="summary" hidden></div>
      <form id="form">
        <input id="input" placeholder="输入暗号" autocomplete="off" />
        <button id="submit" type="submit" disabled>提交</button>
      </form>
      <!-- 没登录：点了请红包页弹出登录卡片（hb.login 要在点击里调用） -->
      <button id="login" type="button" hidden>登录后开始</button>
      <div id="said"></div>
      <section>
        <div class="muted">动态</div>
        <ul id="lines"></ul>
      </section>
      <section>
        <div class="muted" id="mine-title">我的记录</div>
        <ul id="mine"></ul>
      </section>
    </main>
    <script>
      const $ = (id) => document.getElementById(id);
      let open = false;
      let pending = false;
      /** 冷却到什么时候（服务器时间，毫秒，同 hb.now()）。 */
      let cooldownUntil = 0;

      // 能不能点提交：红包开着、不在判定中、没在冷却。
      function refreshButton() {
        const left = Math.ceil((cooldownUntil - (window.hb ? hb.now() : Date.now())) / 1000);
        $("submit").disabled = !open || pending || left > 0;
        $("submit").textContent = pending ? "判定中" : left > 0 ? `${left} 秒后再提交` : "提交";
      }
      setInterval(refreshButton, 500);

      // 没判定时，按原因说一句话（原因的全表见 hb.d.ts 的 HbReason）。
      const reasons = {
        denied: "你没允许这个网页替你提交。",
        login: "请先在红包页上登录。",
        busy: "上一次还没有结果。",
        human_check: "没有通过人机验证。",
        not_in_scope: "你不在这个红包的领取范围里。",
        already_claimed: "你已经领到了。",
        not_open: "红包还没开放。",
        ended: "红包已结束。",
        paused: "判定器连续出错，暂停领取。",
        judge_failed: "判定器出错了，这次没有判定，可以再提交一次。",
        try_later: "提交的人太多，稍后再试。",
        unconfirmed: "没收到结果，看看下面的“我的记录”。",
        away: "回到红包页再提交。",
        not_code: "这个红包不能在这里提交。",
      };

      function showHongbao(hongbao) {
        $("title").textContent = hongbao.title;
        const parts = [];
        if (hongbao.shares)
          parts.push(`剩 ${hongbao.shares.remaining} / ${hongbao.shares.total} 份`);
        if (hongbao.judged !== null) parts.push(`已判定 ${hongbao.judged} 次`);
        if (hongbao.status === "ended")
          parts.push(hongbao.endedByCode ? "判定器结束了这个红包" : "已结束");
        $("facts").textContent = parts.join(" · ");
        open = hongbao.status === "active";
        refreshButton();
      }

      // 看的人自己的情况：没登录给登录按钮，冷却中倒数。
      function showMe(me) {
        $("login").hidden = me.signedIn;
        cooldownUntil = me.signedIn ? (me.cooldownUntil ?? 0) : 0;
        refreshButton();
      }

      function showView(view) {
        $("summary").hidden = !view?.summary;
        $("summary").textContent = view?.summary ?? "";
        // 网页要画的东西从 view.data 来，判定器写进去时带个版本号（比如 { v: 2, ... }）：
        // 改了网页，进行中的红包还跑开放时那一版判定器，网页要能读旧的版本。
      }

      function addLine(line) {
        const item = document.createElement("li");
        item.textContent = `${line.user.name}：${line.text}`;
        $("lines").prepend(item);
      }

      async function showMine() {
        const mine = await hb.mine();
        $("mine-title").textContent = mine ? `我的记录 · ${mine.total} 条` : "我的记录（登录后看得到）";
        $("mine").replaceChildren(
          ...(mine?.items ?? []).map((item) => {
            // 别人的判定改到了他：by 是那个人，没有输入。
            const what = item.by ? `${item.by}的第 ${item.n} 次` : `第 ${item.n} 次「${item.input}」`;
            const moved = item.settled
              ? item.claimed ? `结算 ${item.amount}` : "结算，没有领到"
              : `待结算 ${item.pending ?? "0.00"}`;
            return Object.assign(document.createElement("li"), {
              textContent: `${what} ${moved}${item.reply ? `：${item.reply}` : ""}`,
            });
          }),
        );
      }

      $("form").addEventListener("submit", async (event) => {
        event.preventDefault();
        const input = $("input").value.trim();
        if (!input) return;
        pending = true;
        refreshButton();
        $("said").textContent = "";
        try {
          const result = await hb.submit(input);
          if (result.judged) {
            $("said").textContent = result.claimed
              ? `领到 ${result.amount} ${result.unit}！${result.reply ?? ""}`
              : (result.reply ?? `待结算 ${result.pending ?? "0.00"}`);
            $("input").value = "";
            await showMine();
          } else if (result.reason === "cooldown") {
            $("said").textContent = `${result.seconds} 秒后再试。`;
          } else {
            $("said").textContent = result.message ?? reasons[result.reason] ?? "没有提交。";
          }
        } finally {
          pending = false;
          refreshButton();
        }
      });

      $("login").addEventListener("click", () => hb.login());

      // 没加载到 SDK（离线、被拦截）：照常显示，只是不能提交。
      if (!window.hb) {
        $("facts").textContent = "没有加载到红包站的 SDK，刷新试试。";
      } else {
        hb.ready().then(
          async ({ hongbao }) => {
            showHongbao(hongbao);
            showView(await hb.view());
            showMe(await hb.me());
            hb.on("hongbao", showHongbao);
            hb.on("view", showView);
            hb.on("me", showMe);
            hb.on("announce", addLine);
            await showMine();
          },
          () => {
            // 单独打开（不在红包页里）：照常显示一段说明。
            $("facts").textContent = "这是红包的附带网页，要在红包页里打开才能提交。";
          },
        );
      }
    </script>
  </body>
</html>
