<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!--site-move-->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#6e0f1b" />
    <!--page-meta-->
    <!--brand-icon-->
    <script>
      // A 打赏卡 embedded in another page (/☕/<卡号>?embed, docs/tip-design.md
      // §7): no loader and no desktop, only the card on that page's background.
      if (
        /^\/(?:%E2%98%95|\u2615)\/[^/]+\/?$/i.test(location.pathname) &&
        new URLSearchParams(location.search).has("embed")
      )
        document.documentElement.dataset.embed = "tip";
      // 深色 (src/lib/theme.ts): the system's, or what was chosen in the
      // account card, before the first paint so a dark page never flashes.
      (() => {
        var root = document.documentElement;
        if (root.dataset.embed) return;
        var saved = null;
        try {
          saved = localStorage.getItem("hb.theme");
        } catch (e) {}
        var dark =
          saved === "dark" ||
          (saved !== "light" &&
            !!window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        // The browser's own bar: the 背景's colour, full screen (a phone)
        // the window's (src/lib/theme.ts, docs/redesign/02-shell.md §11).
        var full =
          !!window.matchMedia &&
          window.matchMedia("(max-width: 639px), (max-height: 559px)").matches;
        var bar = document.querySelector('meta[name="theme-color"]');
        if (bar)
          bar.setAttribute(
            "content",
            full ? (dark ? "#1e1719" : "#f3e6e5") : dark ? "#2a0710" : "#6e0f1b",
          );
        if (!dark) return;
        root.dataset.mode = "dark";
        root.dataset.siteDark = "";
        var scheme = document.querySelector('meta[name="color-scheme"]');
        if (scheme) scheme.setAttribute("content", "dark");
      })();
    </script>
    <style>
      /* Boot loader: painted before any JS or app CSS arrives. Colours mirror
         the 夜灯 tokens: the gradients below are the resting state of the
         desktop background plus its three glows, and .boot-frame matches the
         window glass (docs/redesign/02-shell.md §8). */
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: clip;
        background: #3a0710;
      }
      /* Absolute, not fixed: iOS Safari colours its strips above and below
         the page from the root's background when the page loads, and a
         fixed loader over it would be what it takes (02 §11). */
      #boot {
        position: absolute;
        inset: 0;
        z-index: 50;
        display: grid;
        place-items: center;
        background:
          radial-gradient(
            42vmax 42vmax at 10% 108%,
            rgb(242 196 109 / 0.42),
            transparent 70%
          ),
          radial-gradient(
            30vmax 30vmax at 84% -6%,
            rgb(255 122 92 / 0.3),
            transparent 70%
          ),
          radial-gradient(
            18vmax 18vmax at 92% 96%,
            rgb(242 196 109 / 0.18),
            transparent 70%
          ),
          radial-gradient(120% 100% at 15% 0%, #a21d2c 0%, #6e0f1b 48%, #3a0710 100%);
        font-family:
          system-ui,
          -apple-system,
          "PingFang SC",
          "Microsoft YaHei UI",
          sans-serif;
        color: #2a1519;
      }
      /* Squircle corners: elements with data-squircle are clipped by the
         script below using their --sq-r radius, like <Squircle> in the app. */
      #boot .boot-window {
        position: relative;
        /* Same geometry and radii as AppWindow (app-window-frame utility). */
        width: 100vw;
        height: 100dvh;
        --sq-r: 0px;
      }
      @media (min-width: 640px) and (min-height: 560px) {
        #boot .boot-window {
          width: calc(100vw - 32px);
          height: calc(100dvh - 32px);
          --sq-r: 22px;
        }
      }
      @media (min-width: 1024px) and (min-height: 560px) {
        #boot .boot-window {
          width: min(1200px, calc(100vw - 64px));
          height: min(940px, calc(100dvh - 64px));
          --sq-r: 28px;
        }
      }
      /* The long shadow lives on a plate: the clip would cut it off the frame. */
      #boot .boot-plate {
        position: absolute;
        inset: 0;
        border-radius: var(--sq-r);
        box-shadow: 0 30px 60px -28px rgb(30 0 6 / 0.7);
      }
      #boot .boot-frame {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        border-radius: var(--sq-r);
        background: rgb(255 250 248 / 0.84);
        -webkit-backdrop-filter: blur(22px) saturate(1.4);
        backdrop-filter: blur(22px) saturate(1.4);
        box-shadow:
          inset 0 1px 0 rgb(255 255 255 / 0.95),
          inset 0 0 0 1px rgb(255 255 255 / 0.5);
      }
      @media (max-width: 639px), (max-height: 559px) {
        #boot .boot-frame {
          background: rgb(255 250 248 / 0.92);
        }
      }
      /* 深色: the same as .desktop-bg and .window-glass under data-site-dark
         in src/styles.css. */
      html[data-site-dark],
      html[data-site-dark] body {
        background: #16030a;
      }
      /* 满屏 (phones): the root has the window's colour (src/styles.css,
         .app-window-frame), which iOS Safari then gives the strips above
         and below the page; the desktop and the loader cover it. */
      @media (max-width: 639px), (max-height: 559px) {
        html,
        body {
          background: rgb(243 230 229);
        }
        html[data-site-dark],
        html[data-site-dark] body {
          background: rgb(30 23 25);
        }
      }
      html[data-site-dark] #boot {
        color: #ededed;
        background:
          radial-gradient(
            42vmax 42vmax at 10% 108%,
            rgb(242 196 109 / 0.2),
            transparent 70%
          ),
          radial-gradient(
            30vmax 30vmax at 84% -6%,
            rgb(255 122 92 / 0.16),
            transparent 70%
          ),
          radial-gradient(
            18vmax 18vmax at 92% 96%,
            rgb(242 196 109 / 0.1),
            transparent 70%
          ),
          radial-gradient(120% 100% at 15% 0%, #5c1019 0%, #2e0710 48%, #16030a 100%);
      }
      html[data-site-dark] #boot .boot-plate {
        box-shadow: 0 30px 60px -28px rgb(0 0 0 / 0.8);
      }
      html[data-site-dark] #boot .boot-frame {
        background: rgb(30 24 26 / 0.86);
        box-shadow:
          inset 0 1px 0 rgb(255 255 255 / 0.08),
          inset 0 0 0 1px rgb(255 255 255 / 0.08);
      }
      @media (max-width: 639px), (max-height: 559px) {
        html[data-site-dark] #boot .boot-frame {
          background: rgb(30 24 26 / 0.94);
        }
      }
      /* Loading shows the desktop and the mark alone (02 §8, 2026-11-16):
         the window glass is only there to carry a failure. */
      #boot .boot-window {
        grid-area: 1 / 1;
        opacity: 0;
      }
      #boot[data-state="failed"] .boot-window {
        opacity: 1;
      }
      #boot .boot-center {
        grid-area: 1 / 1;
        display: grid;
        justify-items: center;
        transition:
          opacity 200ms ease,
          transform 200ms ease;
      }
      /* 96px tile, its ring hugging it (120 with the ring); the script
         turns the ring's arc and, at the end, flies the mark to the 顶栏. */
      #boot .boot-mark {
        width: 120px;
        height: 120px;
        transform-origin: 0 0;
      }
      #boot .boot-mark svg {
        display: block;
        overflow: visible;
      }
      #boot .boot-failure {
        display: grid;
        justify-items: center;
        gap: 14px;
        font-size: 16px;
      }
      #boot .boot-failure[hidden] {
        display: none;
      }
      #boot .boot-failure button {
        height: 44px;
        padding: 0 20px;
        border: 0;
        --sq-r: 14px;
        border-radius: var(--sq-r);
        background: linear-gradient(180deg, #e8473d, #c51e2a);
        box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.35);
        color: #fff6ee;
        font: inherit;
        cursor: pointer;
      }
      #boot[data-state="failed"] .boot-center {
        display: none;
      }
      #boot[data-state="done"] {
        opacity: 0;
        transition: opacity 220ms ease;
        /* The app is live underneath while the loader fades. */
        pointer-events: none;
      }
      #boot[data-state="done"] .boot-center {
        opacity: 0;
        transform: translateY(-6px);
      }
      /* Handing over (02 §8): the app's own desktop shows through, the
         mark flies to the 顶栏 and the window opens out from it. */
      /* The dark desktop above is html[data-site-dark] #boot: say it again
         here, or the dark loader stays opaque over the window and the
         hand-over shows nothing until the loader goes (2026-11-16). */
      #boot[data-state="reveal"],
      html[data-site-dark] #boot[data-state="reveal"] {
        background: none;
        pointer-events: none;
      }
      #boot[data-state="reveal"] .boot-window {
        display: none;
      }
      #boot[data-state="reveal"] .boot-mark {
        position: fixed;
        left: 0;
        top: 0;
      }
      #boot[data-motion="reduce"],
      #boot[data-motion="reduce"] .boot-center {
        transition: none;
      }
      /* A 打赏卡 embedded in another page: the card alone. */
      html[data-embed] #boot {
        display: none;
      }
      html[data-embed],
      html[data-embed] body {
        overflow: auto;
        background: transparent;
      }
      /* Its root as tall as the card, so anything past the frame's height
         (a scrollbar under a narrow card) scrolls instead of being cut off
         (sweep 2026-11-21, EMBED-BLANK-FAILURE). */
      html[data-embed] #root {
        height: auto;
        overflow: visible;
      }
      /* 深色 (?theme=dark, or auto on a dark system): the shared dark tokens
         turn the words light, so the secondary buttons (查一下, 再打开,
         再打赏) take the dark glass, and words on gold the dark gold ink, as
         in the 社区's mini app (apps/mini/src/mini.css). The site's own are
         under data-site-dark, which an embed never has. Unlayered, so they
         win over styles.css's @layer components (sweep 2026-11-21,
         EMBED-DARK-BUTTONS). */
      html[data-embed][data-mode="dark"] .btn-secondary {
        --btn-top: rgb(255 255 255 / 0.08);
        --btn-bottom: rgb(255 255 255 / 0.08);
        --btn-inset: inset 0 1px 0 rgb(255 255 255 / 0.06);
        --btn-drop: 0 2px 6px -2px rgb(0 0 0 / 0.5);
      }
      html[data-embed][data-mode="dark"] .btn-secondary:hover {
        --btn-top: rgb(255 255 255 / 0.13);
        --btn-bottom: rgb(255 255 255 / 0.13);
      }
      html[data-embed][data-mode="dark"]
        .btn-secondary:active:not(:disabled, [data-disabled]) {
        --btn-inset: inset 0 1px 3px rgb(0 0 0 / 0.35);
        --btn-drop: 0 1px 2px -1px rgb(0 0 0 / 0.3);
      }
      html[data-embed][data-mode="dark"]
        :is(.avatar-ring, .chip-gold, .title-badge[data-title="highest"]) {
        color: #6a4510;
      }
    </style>
  </head>
  <body>
    <div
      id="boot"
      role="progressbar"
      aria-label="正在加载"
      aria-valuemin="0"
      aria-valuemax="100"
      aria-valuenow="0"
    >
      <div class="boot-window" data-boot-window>
        <div class="boot-plate"></div>
        <div class="boot-frame" data-squircle>
          <div class="boot-failure" data-boot-failure hidden>
            <span>加载失败</span>
            <button type="button" data-boot-reload data-squircle>重新加载</button>
          </div>
        </div>
      </div>
      <div class="boot-center"><!--brand-mark--></div>
    </div>
    <div id="root" inert></div>
    <script>
      // Milestones: HTML parsed 12% → bundle evaluated 70% → identity 88% →
      // first frame 100%. Between milestones the bar trickles asymptotically.
      (() => {
        const boot = document.getElementById("boot");
        const appRoot = document.getElementById("root");
        if (!boot || !appRoot) return;
        // Right after a release the page and its bundle can come from two
        // versions for a few seconds: the bundle is missing, or comes back
        // as the page. One quiet reload a moment later gets a matching
        // pair; failing again within a minute is a failed load.
        const retryKey = "hb:boot-retry";
        let retrying = false;
        const retryOnce = () => {
          if (retrying) return true;
          try {
            const last = Number(sessionStorage.getItem(retryKey) || 0);
            if (Date.now() - last < 60000) return false;
            sessionStorage.setItem(retryKey, String(Date.now()));
          } catch {
            return false;
          }
          retrying = true;
          setTimeout(() => location.reload(), 1500);
          return true;
        };
        // Only the site's own scripts count: a third-party one refused by
        // the browser (an ad blocker stopping Cloudflare's analytics
        // beacon, which Cloudflare adds to the page) is not a failed load.
        const ownScript = (event) => {
          const script = event.target;
          return (
            script instanceof HTMLScriptElement &&
            new URL(script.src || location.href, location.href).origin ===
              location.origin
          );
        };
        if (document.documentElement.dataset.embed) {
          boot.remove();
          appRoot.removeAttribute("inert");
          // No loader around the card to say it did not load: a bundle
          // that failed, after its one quiet reload, or nothing drawn after
          // 20 seconds, or the card stopped by an error (main.tsx), leaves
          // one line and 重新加载 in its place, not an empty hole in the
          // host's page. Inline styles in a grey that reads on light and
          // dark pages: the app's CSS may be missing too (sweep 2026-11-21,
          // EMBED-BLANK-FAILURE).
          let stopped = false;
          const fail = () => {
            if (stopped) return;
            stopped = true;
            const box = document.createElement("div");
            box.setAttribute("role", "alert");
            box.style.cssText =
              "display:grid;justify-items:center;align-content:center;gap:6px;min-height:76px;padding:8px 16px;box-sizing:border-box;font:14px/1.5 system-ui,-apple-system,sans-serif;color:#8a8a8a;text-align:center";
            const text = document.createElement("span");
            text.textContent = "打赏卡没有加载出来。";
            const reload = document.createElement("button");
            reload.type = "button";
            reload.textContent = "重新加载";
            reload.style.cssText =
              "font:inherit;color:inherit;background:transparent;border:1px solid currentColor;border-radius:8px;padding:2px 12px;cursor:pointer";
            reload.addEventListener("click", () => location.reload());
            box.append(text, reload);
            appRoot.replaceChildren(box);
          };
          window.hbEmbedFail = fail;
          // Once the card is drawn, the app's own: a script failing later
          // (Cap's helpers) is not a failed load.
          addEventListener(
            "error",
            (event) => {
              if (
                ownScript(event) &&
                !stopped &&
                !appRoot.hasChildNodes() &&
                !retryOnce()
              )
                fail();
            },
            true,
          );
          setTimeout(() => {
            if (!appRoot.hasChildNodes()) fail();
          }, 20000);
          return;
        }
        // figma-squircle's getSvgPath (the engine of @squircle-js/react) for
        // equal corners, smoothing 0.8 as in lib/squircle-path.ts.
        const smoothing = 0.8;
        const squirclePath = (width, height, radius) => {
          const budget = Math.min(width, height) / 2;
          const r = Math.min(radius, budget);
          const s = Math.max(0, Math.min(smoothing, budget / r - 1));
          const p = Math.min((1 + smoothing) * r, budget);
          const deg = Math.PI / 180;
          const arcMeasure = 90 * (1 - s);
          const arc = Math.sin((arcMeasure / 2) * deg) * r * Math.SQRT2;
          const p34 = r * Math.tan(((90 - arcMeasure) / 4) * deg);
          const c = p34 * Math.cos(45 * s * deg);
          const d = c * Math.tan(45 * s * deg);
          const b = (p - arc - c - d) / 3;
          const a = 2 * b;
          const e = a + b + c;
          return (
            `M${width - p} 0c${a} 0 ${a + b} 0 ${e} ${d}` +
            `a${r} ${r} 0 0 1 ${arc} ${arc}c${d} ${c} ${d} ${b + c} ${d} ${e}` +
            `L${width} ${height - p}c0 ${a} 0 ${a + b} ${-d} ${e}` +
            `a${r} ${r} 0 0 1 ${-arc} ${arc}c${-c} ${d} ${-(b + c)} ${d} ${-e} ${d}` +
            `L${p} ${height}c${-a} 0 ${-(a + b)} 0 ${-e} ${-d}` +
            `a${r} ${r} 0 0 1 ${-arc} ${-arc}c${-d} ${-c} ${-d} ${-(b + c)} ${-d} ${-e}` +
            `L0 ${p}c0 ${-a} 0 ${-(a + b)} ${d} ${-e}` +
            `a${r} ${r} 0 0 1 ${arc} ${-arc}c${c} ${-d} ${b + c} ${-d} ${e} ${-d}Z`
          );
        };
        const clipSquircles = () => {
          for (const element of boot.querySelectorAll("[data-squircle]")) {
            const radius = Number.parseFloat(
              getComputedStyle(element).getPropertyValue("--sq-r"),
            );
            const { offsetWidth: width, offsetHeight: height } = element;
            element.style.clipPath =
              radius > 0 && width > 0 && height > 0
                ? `path('${squirclePath(width, height, radius)}')`
                : "";
          }
        };
        clipSquircles();
        addEventListener("resize", clipSquircles);

        const mark = boot.querySelector("[data-boot-mark]");
        const arc = boot.querySelector("[data-boot-arc]");
        const track = boot.querySelector("[data-boot-track]");
        const ring = boot.querySelector("[data-boot-ring]");
        const dot = boot.querySelector("[data-boot-dot]");
        const glint = boot.querySelector("[data-boot-glint]");
        // A cubic-bezier, as CSS's, for the hand-over below.
        const bezier = (x1, y1, x2, y2) => (x) => {
          if (x <= 0) return 0;
          if (x >= 1) return 1;
          let lo = 0;
          let hi = 1;
          let t = x;
          for (let i = 0; i < 24; i++) {
            t = (lo + hi) / 2;
            const at = 3 * x1 * t * (1 - t) ** 2 + 3 * x2 * t * t * (1 - t) + t ** 3;
            if (at < x) lo = t;
            else hi = t;
          }
          return 3 * y1 * t * (1 - t) ** 2 + 3 * y2 * t * t * (1 - t) + t ** 3;
        };
        const clamp = (v) => Math.max(0, Math.min(1, v));
        const mix = (a, b, k) => a + (b - a) * k;
        // The dot breathes while loading: 62% of its size, a little more on
        // each breath (1.6s), brighter as it swells.
        const DOT = 14.4;
        const breath = (now) =>
          0.5 + 0.5 * Math.sin(((now / 1000) * 2 * Math.PI) / 1.6 - Math.PI / 2);
        const dotRadius = (now) => DOT * 0.62 * (1 + 0.16 * breath(now));
        const failure = boot.querySelector("[data-boot-failure]");
        const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
        if (reduce) boot.dataset.motion = "reduce";

        const stages = {
          script: [70, 86],
          identity: [88, 97],
          frame: [100, 100],
        };
        const minimumVisible = 450;
        const startedAt = performance.now();
        const queue = [];
        const listeners = [];
        let floor = 12;
        let ceiling = 64;
        let value = 0;
        let failed = false;

        const api = {
          done: false,
          /** Arrival time of each milestone, for diagnosing slow starts. */
          timings: {},
          mark(stage) {
            if (!(stage in api.timings)) api.timings[stage] = performance.now();
            if (stages[stage] && !queue.includes(stage)) queue.push(stage);
          },
          fail() {
            if (api.done || failed) return;
            failed = true;
            boot.dataset.state = "failed";
            if (failure) failure.hidden = false;
            clipSquircles();
          },
          onDone(callback) {
            if (api.done) callback();
            else listeners.push(callback);
          },
        };
        window.hbBoot = api;

        const render = () => {
          const shown = Math.min(100, Math.floor(value));
          // The arc is the progress, turning steadily the whole time; at
          // 100% its ends meet.
          const now = performance.now();
          if (arc) {
            const length = Math.max(50, Math.min(1000, value * 10));
            arc.setAttribute(
              "stroke-dasharray",
              length >= 999 ? "1000 0" : `${length} ${1000 - length}`,
            );
            arc.setAttribute(
              "stroke-dashoffset",
              reduce ? "0" : String(-(((now / 1000) * 0.55) % 1) * 1000),
            );
          }
          if (dot && !reduce) {
            dot.setAttribute("r", String(dotRadius(now)));
            dot.setAttribute("opacity", String(0.78 + 0.22 * breath(now)));
          }
          boot.setAttribute("aria-valuenow", String(shown));
        };

        // Handing over (docs/redesign/02-shell.md §8): the ring closes into
        // the dot, the mark flies on an arc to the 顶栏's home button, the
        // 顶栏 grows out from behind it on the way, unrolls to the right and
        // the window drops down from it; the window's contents come out of a
        // long band of mist that follows each edge, not part by part. The
        // mist is two layers moved by transforms only (a mask redrawn every
        // frame stalled phones). Reduced motion, a hidden tab or a missing
        // part: the loader fades as it always did.
        const handOver = () => {
          const frame = document.querySelector(".app-window-frame");
          const stage = document.querySelector("[data-window-stage]");
          const home = document.querySelector("[data-boot-home]");
          const bar = document.querySelector(".window-bar");
          const shell = boot.querySelector("[data-boot-window]");
          // Automated browsers (the e2e suites) get the plain fade, so tests
          // do not wait out the flight; one that sets hb:boot-reveal sees it.
          let watched = false;
          try {
            watched = sessionStorage.getItem("hb:boot-reveal") === "1";
          } catch {}
          if (navigator.webdriver && !watched) return false;
          if (reduce || document.hidden || !mark || !frame || !stage || !home || !bar)
            return false;
          const plate = frame.querySelector(".window-plate");
          const win = frame.getBoundingClientRect();
          const target = home.getBoundingClientRect();
          const barHeight = bar.getBoundingClientRect().height;
          const radius =
            Number.parseFloat(getComputedStyle(shell).getPropertyValue("--sq-r")) || 0;
          const from = mark.getBoundingClientRect();
          const x0 = from.left + from.width / 2;
          const y0 = from.top + from.height / 2;
          const x1 = target.left + target.width / 2;
          const y1 = target.top + target.height / 2;
          const landSize = target.width;
          const r0 = dot ? Number(dot.getAttribute("r")) : DOT;
          const closing = dot ? 0.42 : 0;
          const flyAt = dot ? 0.45 : 0.1;
          const inward = bezier(0.55, 0, 0.25, 1);
          const thicken = bezier(0.45, 0, 0.3, 1);
          const rounder = bezier(0.4, 0, 0.2, 1);
          const swell = bezier(0.3, 0, 0.2, 1);
          const thrown = bezier(0.45, 0, 0.2, 1);
          const settle = bezier(0.2, 0, 0, 1);
          const sprout = bezier(0.4, 0, 0.2, 1);
          const unrolls = bezier(0.3, 0, 0.1, 1);
          const clears = bezier(0.42, 0, 0.3, 1);
          // The mist: the glass's colour, nearly opaque, with a long eased
          // edge (a third of the width along the 顶栏, two fifths of the
          // height below it).
          const fogColor = document.documentElement.hasAttribute("data-site-dark")
            ? "30 24 26"
            : "255 250 248";
          const fogBand = (dir, band) =>
            `linear-gradient(${dir}, ${[0, 0.15, 0.3, 0.45, 0.6, 0.75, 0.9, 1]
              .map(
                (x) =>
                  `rgb(${fogColor} / ${(0.94 * x * x * (3 - 2 * x)).toFixed(3)}) ${(x * band).toFixed(1)}px`,
              )
              .join(", ")})`;
          const bandX = Math.min(420, Math.max(120, win.width * 0.35));
          const bandY = Math.min(380, Math.max(160, win.height * 0.4));
          const fogLayer = (box, size, background) => {
            const outer = document.createElement("div");
            outer.style.cssText = `position:absolute;left:0;overflow:hidden;pointer-events:none;z-index:2147483647;${box}`;
            const inner = document.createElement("div");
            inner.style.cssText = `position:absolute;left:0;top:0;will-change:transform;${size};background:${background}`;
            outer.append(inner);
            frame.append(outer);
            return [outer, inner];
          };
          const [barFog, barMist] = fogLayer(
            `top:0;width:${win.width}px;height:${barHeight}px`,
            `width:${win.width + bandX}px;height:100%`,
            fogBand("to right", bandX),
          );
          const [bodyFog, bodyMist] = fogLayer(
            `top:${barHeight}px;width:${win.width}px;height:${win.height - barHeight}px`,
            `width:100%;height:${win.height - barHeight + bandY}px`,
            fogBand("to bottom", bandY),
          );
          // Along the 顶栏 the mist starts just past the home button, so the
          // mark lands clear; below it everything starts covered.
          const fogX0 = x1 - win.left + landSize / 2 + 4;
          const fogY0 = barHeight - bandY;
          barMist.style.transform = `translate3d(${fogX0}px, 0, 0)`;
          bodyMist.style.transform = `translate3d(0, ${fogY0 - barHeight}px, 0)`;
          // Each part hidden until it is reached.
          frame.style.clipPath = "inset(50%)";
          if (plate) plate.style.opacity = "0";
          home.style.visibility = "hidden";
          if (arc) arc.style.display = "none";
          if (track) track.style.display = "none";
          const startedAt = performance.now();
          let ended = false;
          let plateShown = false;
          const showPlate = () => {
            if (plateShown || !plate) return;
            plateShown = true;
            plate.style.transition = "opacity 240ms ease";
            plate.style.opacity = "";
          };
          const end = () => {
            if (ended) return;
            ended = true;
            frame.style.clipPath = "";
            barFog.remove();
            bodyFog.remove();
            home.style.visibility = "";
            showPlate();
            removeEventListener("resize", clipSquircles);
            boot.remove();
          };
          const step = (now) => {
            if (ended) return;
            const t = (now - startedAt) / 1000;
            // 1. The ring moves in and thickens, squircle to circle, and
            //    becomes the dot, which swells to meet it; a small bounce.
            if (dot && ring) {
              const k = inward(clamp(t / closing));
              const width = mix(7, DOT, thicken(clamp(t / closing)));
              const size = Math.max(0.02, mix(109, DOT * 2, k) - width);
              const round = mix(0.6394, 1, rounder(k));
              ring.setAttribute("d", squirclePath(size, size, (round * size) / 2));
              ring.setAttribute("transform", `translate(${-size / 2} ${-size / 2})`);
              ring.setAttribute("stroke-width", String(width));
              ring.style.display = t < closing ? "" : "none";
              const after = t - closing;
              const grown = mix(r0, DOT, swell(clamp(t / closing)));
              // Where the ring's inner edge reaches the dot the two overlap a
              // little, so no hairline shows between their edges.
              const hole = (size - width) / 2;
              dot.setAttribute(
                "r",
                String(
                  after < 0
                    ? hole < grown + 1.5
                      ? Math.max(grown, hole + 1)
                      : grown
                    : DOT * (1 + 0.14 * Math.sin(clamp(after / 0.22) * Math.PI)),
                ),
              );
              dot.setAttribute("opacity", "1");
              if (glint)
                glint.setAttribute("stroke-opacity", String(0.7 * clamp((t - closing - 0.06) / 0.14)));
            }
            // 2. The flight, with the 顶栏 growing out from behind the mark.
            const flight = t - flyAt;
            if (flight >= 0) {
              if (boot.dataset.state !== "reveal") boot.dataset.state = "reveal";
              const k = thrown(clamp(flight / 0.55));
              // A parabola whose top is the landing point: it rises fast and
              // glides in level, never above the 顶栏 it lands in.
              const x = mix(x0, x1, k);
              const y = y1 + (y0 - y1) * (1 - k) ** 2;
              const size = mix(96, landSize, settle(clamp(flight / 0.5)));
              mark.style.transform = `translate(${x}px, ${y}px) scale(${size / 96}) translate(-60px, -60px)`;
              if (flight >= 0.55) {
                home.style.visibility = "";
                mark.style.visibility = "hidden";
              }
              const e = sprout(clamp((k - 0.35) / 0.65));
              const unroll = unrolls(clamp((flight - 0.42) / 0.42));
              const drop = unrolls(clamp((flight - 0.7) / 0.5));
              const tall = mix(size * 0.62, barHeight, e);
              const top = y - tall / 2 + mix(0, barHeight / 2 - (y1 - win.top), e);
              const left = x + mix(0, win.left - x1, e);
              const right = mix(x + mix(0, landSize / 2 + 10, e), win.right, unroll);
              const bottom = mix(top + tall, win.bottom, drop);
              const round = mix(tall / 2, radius, clamp(drop * 3));
              frame.style.clipPath = `inset(${top - win.top}px ${win.right - right}px ${win.bottom - bottom}px ${left - win.left}px round ${round}px)`;
              // The mist clears behind each edge, slower than the edge, and
              // goes on past it once the window is out.
              const fogX = mix(fogX0, win.width, clears(clamp((flight - 0.47) / 0.6)));
              const fogY = mix(fogY0, win.height, clears(clamp((flight - 0.74) / 0.68)));
              barMist.style.transform = `translate3d(${fogX}px, 0, 0)`;
              bodyMist.style.transform = `translate3d(0, ${fogY - barHeight}px, 0)`;
              if (drop >= 1) showPlate();
              if (flight >= 1.42) {
                end();
                return;
              }
            }
            requestAnimationFrame(step);
          };
          // The first frame now: the arc and track are already hidden, so
          // waiting a frame would show the mark without its ring once.
          step(startedAt);
          // A tab hidden half way stops frames: never leave the app covered.
          setTimeout(end, 3500);
          return true;
        };

        const finish = () => {
          if (api.done) return;
          value = 100;
          render();
          api.done = true;
          api.timings.done = performance.now();
          try {
            sessionStorage.removeItem(retryKey);
          } catch {}
          appRoot.removeAttribute("inert");
          const handing = handOver();
          if (!handing) boot.dataset.state = "done";
          for (const callback of listeners.splice(0)) callback();
          window.dispatchEvent(new CustomEvent("hb:boot-done"));
          if (!handing)
            setTimeout(() => {
              removeEventListener("resize", clipSquircles);
              boot.remove();
            }, reduce ? 0 : 240);
        };

        const tick = (now, painted) => {
          if (failed || api.done) return;
          if (queue.length > 0) {
            const [nextFloor, nextCeiling] = stages[queue.shift()];
            floor = Math.max(floor, nextFloor);
            ceiling = Math.max(ceiling, nextCeiling);
          }
          if (!painted) value = Math.max(value, floor);
          value =
            value < floor
              ? value + Math.max(0.8, (floor - value) * 0.22)
              : value + (ceiling - value) * 0.012;
          value = Math.min(value, 100);
          render();
          // Nothing is painted in hidden tabs, so skip the minimum display there.
          const shown = painted && !document.hidden;
          if (
            floor >= 100 &&
            (!shown || (value >= 99.5 && now - startedAt >= minimumVisible))
          ) {
            finish();
            return;
          }
          schedule();
        };
        // Frames pause in hidden or occluded tabs. Race each frame against a
        // timer so loading still completes; at normal frame rates rAF wins.
        const schedule = () => {
          let ran = false;
          const run = (painted) => {
            if (ran) return;
            ran = true;
            tick(performance.now(), painted);
          };
          requestAnimationFrame(() => run(true));
          setTimeout(() => run(false), 120);
        };
        schedule();

        boot
          .querySelector("[data-boot-reload]")
          ?.addEventListener("click", () => location.reload());
        addEventListener(
          "error",
          (event) => {
            if (ownScript(event) && !api.done && !failed && !retryOnce())
              api.fail();
          },
          true,
        );
        // A bundle that has not run after 20 seconds is a failed load. One
        // that has is the app's business from then on: hand over at once.
        setTimeout(() => {
          if (api.done || failed) return;
          if ("script" in api.timings) finish();
          else api.fail();
        }, 20000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
